name: Deploy GPRO Command to Beget

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'command.html'
      - 'command.css'
      - 'command.js'
      - 'portfolio.js'
      - 'backup.js'
      - 'bootstrap.js'
      - 'server-sync.js'
      - 'api/**'
      - '.github/workflows/deploy-beget.yml'
  workflow_dispatch:

concurrency:
  group: beget-command-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FTP_HOST: ${{ secrets.BEGET_FTP_HOST }}
      FTP_USER: ${{ secrets.BEGET_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.BEGET_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$FTP_HOST" || -z "$FTP_USER" || -z "$FTP_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Beget FTP secrets are missing. Deployment cannot be verified."\n            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install FTPS client
        if: steps.config.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Publish frontend via verified FTPS
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gpro-publish"
          cp index.html command.html command.css command.js portfolio.js backup.js bootstrap.js server-sync.js "$RUNNER_TEMP/gpro-publish/"
          mkdir -p "$RUNNER_TEMP/gpro-publish/api"
          cp api/state.php api/.htaccess "$RUNNER_TEMP/gpro-publish/api/"
          cd "$RUNNER_TEMP/gpro-publish"
          # FTP account must be restricted in Beget to the Command Center public_html.
          # Do not turn off TLS certificate verification or use plain FTP.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST" <<'LFTP'
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 20
          # Force a consistent release: stale FTP timestamps must not skip unchanged JS modules.
          mirror --reverse --verbose --transfer-all --no-perms --parallel=2 ./ .
          # Verify the entry module is present before reporting success.
          cls -l portfolio.js
          cls -l bootstrap.js
          cls -l index.html
          get portfolio.js -o /tmp/gpro-remote-portfolio.js
          get bootstrap.js -o /tmp/gpro-remote-bootstrap.js
          get index.html -o /tmp/gpro-remote-index.html
          bye
          LFTP
          cmp portfolio.js /tmp/gpro-remote-portfolio.js
          cmp bootstrap.js /tmp/gpro-remote-bootstrap.js
          cmp index.html /tmp/gpro-remote-index.html
          echo "Critical deployed files match GitHub build byte for byte."

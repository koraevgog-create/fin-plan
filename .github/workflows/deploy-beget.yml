name: GPRO Beget Safe Preflight

# Production deployment is intentionally disabled until Beget FTPS 426 is fixed.
# Never mutate the live site automatically from a push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpro-beget-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_HOST: ${{ secrets.BEGET_FTP_HOST }}
      FTP_USER: ${{ secrets.BEGET_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.BEGET_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check application files
        shell: bash
        run: |
          set -euo pipefail
          test -s portfolio.js
          test -s bootstrap.js
          test -s index.html
          test -s server-sync.js
          node --check portfolio.js
          node --check server-sync.js
          node --check backup.js
          node --check command.js
          node --check bootstrap.js
          php -l api/state.php
          sha256sum portfolio.js bootstrap.js index.html
      - name: Check public site without modifying production
        shell: bash
        run: |
          set -euo pipefail
          origin="http://command.d900325z.beget.tech"
          for file in index.html bootstrap.js portfolio.js server-sync.js; do
            curl --fail --show-error --silent --location --retry 2 --max-time 20 \
              "$origin/$file?preflight=$GITHUB_SHA" -o "/tmp/gpro-$file"
            test -s "/tmp/gpro-$file"
            if [ "$file" = portfolio.js ]; then
              node --check "/tmp/gpro-$file"
            fi
            echo "Public file available: $file"
          done
      - name: Check FTPS credentials without upload
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FTP_HOST" || -z "$FTP_USER" || -z "$FTP_PASSWORD" ]]; then
            echo "::warning::Beget FTPS secrets missing; publishing remains disabled."
            exit 0
          fi
          echo "FTPS credentials configured. No uploads attempted."
          echo "::notice::Production deploy remains disabled until FTPS 426 root cause is resolved and release switching is tested."

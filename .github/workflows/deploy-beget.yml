name: GPRO Beget Manual Deploy (FTPS blocked)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpro-beget-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.BEGET_FTP_HOST }}
      USERNAME: ${{ secrets.BEGET_FTP_USER }}
      PASSWORD: ${{ secrets.BEGET_FTP_PASSWORD }}
      ORIGIN: http://command.d900325z.beget.tech
    steps:
      - uses: actions/checkout@v4
      - name: Validate files before upload
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USERNAME" && test -n "$PASSWORD"
          for file in index.html command.html command.css bootstrap.js portfolio.js personal-finance.js backup.js server-sync.js; do test -s "$file"; done
          for file in bootstrap.js portfolio.js personal-finance.js backup.js server-sync.js; do node --check "$file"; done
          grep -q 'personalFinance' index.html
          grep -q 'personal-finance.js' bootstrap.js
      - name: Upload and verify each replacement before switching
        shell: bash
        run: |
          set -euo pipefail
          ftp_base="ftp://$HOST"
          # Dependencies first; entry documents last. Never delete or mirror directories.
          files=(personal-finance.js command.css backup.js server-sync.js portfolio.js bootstrap.js command.html index.html)
          for file in "${files[@]}"; do
            temporary=".${file}.gpro-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tmp"
            echo "Uploading staged copy of $file"
            curl --fail --show-error --silent --ftp-ssl-reqd --connect-timeout 20 --max-time 180 --retry 2 \
              --user "$USERNAME:$PASSWORD" --upload-file "$file" "$ftp_base/$temporary"
            echo "Verifying staged copy of $file"
            curl --fail --show-error --silent --location --max-time 30 \
              "$ORIGIN/$temporary" -o "/tmp/gpro-verify-$file"
            cmp "$file" "/tmp/gpro-verify-$file"
            echo "Verified staged bytes for $file; activating via FTP rename"
            curl --fail --show-error --silent --ftp-ssl-reqd --connect-timeout 20 --max-time 40 \
              --user "$USERNAME:$PASSWORD" \
              --quote "RNFR $temporary" --quote "RNTO $file" "$ftp_base/" -o /dev/null
            echo "Activated $file"
          done
      - name: Confirm public entry and dependencies
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html bootstrap.js portfolio.js personal-finance.js; do
            curl --fail --show-error --silent --location --max-time 30 "$ORIGIN/$file?build=$GITHUB_SHA" -o "/tmp/gpro-live-$file"
            cmp "$file" "/tmp/gpro-live-$file"
          done
          echo "Deployed files verified. index.php and server data were not touched."

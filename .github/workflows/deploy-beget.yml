name: Deploy GPRO Command to Beget

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'command.html'
      - 'command.css'
      - 'command.js'
      - 'portfolio.js'
      - 'backup.js'
      - 'bootstrap.js'
      - 'server-sync.js'
      - 'api/**'
      - '.github/workflows/deploy-beget.yml'
  workflow_dispatch:

concurrency:
  group: beget-command-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FTP_HOST: ${{ secrets.BEGET_FTP_HOST }}
      FTP_USER: ${{ secrets.BEGET_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.BEGET_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check FTPS configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FTP_HOST" || -z "$FTP_USER" || -z "$FTP_PASSWORD" ]]; then
            echo "::error::Beget FTP secrets are missing; deployment was NOT performed."
            exit 1
          fi

      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Upload, verify and promote without deleting live files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gpro-publish/api" "$RUNNER_TEMP/gpro-verify/api"
          cp index.html command.html command.css command.js portfolio.js backup.js bootstrap.js server-sync.js "$RUNNER_TEMP/gpro-publish/"
          cp api/state.php api/.htaccess "$RUNNER_TEMP/gpro-publish/api/"
          cd "$RUNNER_TEMP/gpro-publish"

          # No mirror and no removal of existing files. The FTP user must be
          # restricted to this site's public_html; state storage is not touched.
          files=(command.css command.js backup.js server-sync.js command.html portfolio.js bootstrap.js index.html api/.htaccess api/state.php)
          {
            echo 'set cmd:fail-exit yes'
            echo 'set ftp:ssl-force yes'
            echo 'set ftp:ssl-protect-data yes'
            echo 'set ssl:verify-certificate yes'
            echo 'set net:max-retries 5'
            echo 'set net:reconnect-interval-base 3'
            echo 'set net:timeout 45'
            echo 'set xfer:clobber yes'
            echo 'mkdir -f api'
            # First upload ALL files to temporary names, never removing live files.
            for f in "${files[@]}"; do
              printf 'put -c "%s" -o "%s.gpro-upload"\n' "$f" "$f"
            done
            # Download and verify the staged files before replacing live files.
            for f in "${files[@]}"; do
              printf 'get "%s.gpro-upload" -o "%s"\n' "$f" "$RUNNER_TEMP/gpro-verify/$f"
            done
            echo 'bye'
          } > "$RUNNER_TEMP/gpro-stage.lftp"

          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST" -f "$RUNNER_TEMP/gpro-stage.lftp"
          for f in "${files[@]}"; do
            cmp "$f" "$RUNNER_TEMP/gpro-verify/$f"
          done
          echo "All staged files verified byte-for-byte."

          # Promote the entry point LAST so clients never load a new HTML file
          # while the corresponding JavaScript has not yet been uploaded.
          {
            echo 'set cmd:fail-exit yes'
            echo 'set ftp:ssl-force yes'
            echo 'set ftp:ssl-protect-data yes'
            echo 'set ssl:verify-certificate yes'
            echo 'set net:max-retries 5'
            echo 'set net:reconnect-interval-base 3'
            echo 'set net:timeout 45'
            for f in "${files[@]}"; do
              printf 'mv "%s.gpro-upload" "%s"\n' "$f" "$f"
            done
            echo 'bye'
          } > "$RUNNER_TEMP/gpro-promote.lftp"
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST" -f "$RUNNER_TEMP/gpro-promote.lftp"
          echo "Deployment completed; index.html promoted after all modules."
